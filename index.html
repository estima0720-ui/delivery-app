<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>配送指示書ナビ</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header class="app-header">
  <h1>🚚 配送指示書ナビ</h1>
</header>

<main class="container">

  <section class="card">
    <h2>📄 ファイル選択</h2>
    <input type="file" id="fileInput" accept="image/*,application/pdf" />
  </section>

  <section class="card">
    <h2>🖼 プレビュー</h2>
    <div id="previewArea"></div>
  </section>

  <section class="card">
    <h2>🧠 OCR結果</h2>
    <div id="ocrText">（未処理）</div>
  </section>

  <section class="card">
    <h2>📦 ランキング</h2>
    <div id="driveList"></div>
  </section>

  <section class="card">
    <h2>📂 Google Drive</h2>
    <button id="loginBtn">Googleログイン</button>
    <div id="driveUser">未ログイン</div>
    
    <!-- 新設：参考写真フォルダへのダイレクトリンク -->
    <div class="folder-link-area" style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #e0e0e0; font-size: 14px;">
      <span style="margin-right: 5px;">📂</span>
      <a id="driveFolderLink" 
         href="https://drive.google.com/drive/folders/1gnQl5Tbsn-CIZgI5xF3h0Twqe9IucqEw" 
         target="_blank" 
         rel="noopener noreferrer" 
         style="color: #1a73e8; text-decoration: none; font-weight: bold;">
        「001_台帳」（丸トラ台帳）フォルダ（Google ドライブ）を開く
      </a>
    </div>
  </section>

</main>

<script src="https://accounts.google.com/gsi/client"></script>

<script src="./js/ui.js"></script>
<!-- 旧MATCHER廃止に伴い、matcher.js の読み込みタグを削除しました -->
<script src="./js/drive.js"></script>
<script src="./config.local.js"></script> <!-- app.jsの前にロードします -->
<script src="./js/app.js"></script>

</body>
</html>
