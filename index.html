<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配送指示書ナビ Ver0.1</title>

 <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🚚 配送指示書ナビ Ver0.1</h1>

    <div class="card">
        <label>Google Drive検索</label>
        <div class="search-box">
            <input type="text" id="driveSearch" placeholder="ファイル名を入力">
            <button id="searchBtn">検索</button>
        </div>
    </div>

    <div class="card">
        <label>配送指示書</label><br>
        <input type="file" id="fileInput" accept=".pdf,image/*">
    </div>

    <div class="card">
        <label>配送先</label><br>

        <select id="destination">
            <option>選択してください</option>
        </select>
    </div>

    <div class="card">
        <label>住所</label>

        <p id="address">
            まだ選択されていません
        </p>
    </div>

    <button id="mapBtn">
        📍 Google Maps
    </button>

</div>

 <script src="script.js"></script>

</body>
</html>
