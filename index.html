<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>配送指示書ナビ</title>

  <!-- iOS（iPhone）ホーム画面追加時の設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="配送ナビ">
  
  <!-- ご自身でデザインしたアイコン画像をルートに配置して指定（180x180px推奨） -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header class="app-header">
  <h1>🚚 配送指示書ナビ</h1>
</header>

<main class="container">

  <!-- 1. 準備・設定 & 台帳リンク（最上部へ移動・統合） -->
  <section class="card" style="border: 2px solid #1e50a2; background-color: #fafcff;">
    <h2>⚙️ 準備・設定 & 台帳リンク</h2>
    
    <!-- 台帳フォルダへのリンク -->
    <div class="folder-link-area" style="margin-bottom: 15px; padding: 12px; background: #eef5fc; border-radius: 6px; font-size: 14px; border-left: 5px solid #1a73e8;">
      <span style="margin-right: 5px; font-size: 16px;">📂</span>
      <a id="driveFolderLink" 
         href="https://drive.google.com/drive/folders/1gnQl5Tbsn-CIZgI5xF3h0Twqe9IucqEw" 
         target="_blank" 
         rel="noopener noreferrer" 
         style="color: #1a73e8; text-decoration: none; font-weight: bold; font-size: 15px;">
        「001_台帳」（丸トラ台帳）フォルダ（Google ドライブ）を開く
      </a>
      <div style="font-size: 11px; color: #d9534f; margin-top: 5px; font-weight: bold;">
        ※ AI抽出は参考情報です。うまく抽出されない場合は、上のリンクから手動でお調べください。
      </div>
    </div>

    <!-- ステータス・ログイン表示エリア -->
    <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 4px; align-items: center;">
      <!-- Googleログイン関係 -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="loginBtn" style="padding: 6px 12px; font-size: 13px; cursor: pointer; font-weight: bold;">Googleログイン</button>
        <span id="driveUser" style="font-size: 13px; font-weight: bold; color: #555;">未ログイン</span>
      </div>
      
      <!-- APIキーの入力確認 -->
      <div style="font-size: 13px;">
        🔑 APIキー: <span id="apiKeyStatus" style="font-weight: bold; color: #e74c3c;">確認中...</span>
      </div>

      <!-- 総合使用OKステータス -->
      <div id="systemStatusBadge" style="margin-left: auto; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; background: #ffebee; color: #c62828; border: 1px solid currentColor;">
        ❌ 設定未完了
      </div>
    </div>

    <!-- 【追加】来訪者カウンター表示エリア（デザインに溶け込むように実装） -->
    <div id="visitor-counter" style="display: flex; gap: 20px; align-items: center; margin-bottom: 15px; padding: 8px 12px; background: #fff; border: 1px solid #eee; border-radius: 4px; font-size: 12px; color: #555;">
      <span style="font-weight: bold; color: #1e50a2;">📊 来訪者カウンター:</span>
      <span>今日 <strong id="today-count" style="color: #d9534f; font-size: 14px;">--</strong> 人</span>
      <span>/</span>
      <span>累計 <strong id="total-count" style="color: #5cb85c; font-size: 14px;">--</strong> 人</span>
    </div>

    <!-- AI機能スイッチ群 -->
    <div style="display: flex; gap: 20px; flex-wrap: wrap; padding: 10px; background: #f5f5f5; border-radius: 4px; font-size: 13px; align-items: center;">
      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: bold; user-select: none;">
        <input type="checkbox" id="aiOcrSwitch" checked style="transform: scale(1.2); cursor: pointer;">
        🧠 AI配送先抽出を行う (デフォルト: ON)
      </label>
      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: bold; user-select: none;">
        <input type="checkbox" id="aiDoubleCheckSwitch" style="transform: scale(1.2); cursor: pointer;">
        🔍 決定時にAI最終ダブルチェックを行う (デフォルト: OFF)
      </label>
    </div>
  </section>

  <!-- 2. ファイル選択 -->
  <section class="card">
    <h2>📄 ファイル選択</h2>
    <div style="display: flex; justify-content: center; align-items: center; padding: 25px 10px; background-color: #fafafa; border: 2px dashed #ccc; border-radius: 6px;">
      <input type="file" id="fileInput" accept="image/*,application/pdf" style="font-size: 16px; padding: 10px; cursor: pointer; max-width: 100%; font-weight: bold;" />
    </div>
  </section>

  <!-- 3. プレビュー -->
  <section class="card">
    <h2>🖼 プレビュー</h2>
    <div id="previewArea"></div>
  </section>

  <!-- 4. OCR結果 -->
  <section class="card">
    <h2>🧠 OCR結果</h2>
    <div id="ocrText" style="white-space: pre-wrap; background: #fdfdfd; padding: 10px; border: 1px solid #eee; border-radius: 4px; font-family: monospace;">（未処理）</div>
  </section>

  <!-- 5. ランキング -->
  <section class="card">
    <h2>📦 ランキング</h2>
    <div id="driveList"></div>
  </section>

</main>

<script src="https://accounts.google.com/gsi/client"></script>

<script src="./js/ui.js"></script>
<!-- 【追加】カウンター用処理ファイルを drive.js より前に読み込む -->
<script src="./js/counter.js"></script>
<script src="./js/drive.js"></script>
<script src="./config.local.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
