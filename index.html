<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>配送指示書ナビ</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- ヘッダー -->
  <header class="app-header">
    <h1>🚚 配送指示書ナビ</h1>

    <!-- 設定ボタン（将来用） -->
    <button id="settingsBtn" class="icon-btn">⚙️</button>
  </header>

  <!-- メイン -->
  <main class="container">

 <!-- ファイル選択 -->
<section class="card">
  <h2>📄 配送指示書を選択</h2>
  <input type="file" id="fileInput" accept="application/pdf,image/*" />
</section>

<!-- プレビュー -->
<section class="card">
  <h2>プレビュー</h2>
  <div id="previewArea" class="preview-area">
    <p class="placeholder">PDF・画像がここに表示されます</p>
  </div>
</section>

<!-- 配送先（OCR結果） -->
<section class="card">
  <h2>配送先</h2>
  <div id="deliveryStatus">▼ 読み取り前</div>
</section>

<!-- OCR結果 -->
<section class="card">
  <h2>🧠 OCR結果</h2>
  <div id="ocrText" class="ocr-box">
    （未処理）
  </div>
</section>

<!-- 配送先マスター -->
<section class="card">
  <h2>📦 配送先マスター</h2>
  <input type="file" id="csvInput" accept=".csv" />
  <div id="masterStatus">（未読み込み）</div>
</section>

<!-- Google Drive -->
<section class="card">
  <h2>Google Drive</h2>
  <div id="driveStatus">（未検索）</div>
</section>

<!-- OpenStreetMap -->
<section class="card">
  <h2>OpenStreetMap</h2>
  <div id="osmStatus">（未表示）</div>
</section>

<!-- Google Maps -->
<section class="card">
  <h2>📍 Google Maps</h2>
  <div id="mapStatus"></div>
</section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
